[redaction]
extra_patterns = []

[retention]
raw_days = 180

[sync]
# remote is unset by default: nothing is pushed
fetch_throttle_seconds = 300

[hooks]
time_budget_ms = 2000

[capture]
precompact_snapshot = false
stale_session_minutes = 120
# 0 keeps tool results whole; N cuts each at N characters
tool_result_max_chars = 0

[logs]
max_bytes = 1048576

[retrieval]
enabled = true
brief = true

[store]
session_warn_bytes = 10485760
store_warn_bytes = 1073741824

[graph]
languages = ["python", "typescript", "javascript"]
exclude = []
# the longest a command waits for the graph
query_budget_ms = 5000
# how many recent non-merge commits count toward co-change
cochange_commits = 2000
