# The questions `ctx eval` asks of eval/stage2/corpus, with eval/stage2/repo.bundle for commit
# messages. Each [[question]] has:
#   text    the question, in a developer's words rather than the corpus's own phrasing
#   expect  a full session id, or the first 12 characters of a commit SHA
# The comment above each question names the tasks.toml task it is about and the answer type.
# Questions asking "which commit" expect the commit; all others expect the session.

# reject-pickle, session
[[question]]
text = "did we ever try storing the ledger with pickle, and why did we go back to json?"
expect = "ce6a5816-558c-45c3-ae86-f49e400e7ddc"

# reject-sqlite, session
[[question]]
text = "how much faster was sqlite than the json file at summing totals when we benchmarked it?"
expect = "0ad7623d-bd08-434b-9b35-af3b1849d85f"

# fix-float-cents, session
[[question]]
text = "is there a test that 19.99 doesn't end up a cent short because of float rounding?"
expect = "1d8e00c7-f27c-4a85-9425-0d9bd14ffedd"

# fix-empty-list, session
