[project]
name = "wscontext"
version = "0.1.0"
description = "Local harness for Claude Code: session capture, commit links and search"
requires-python = ">=3.13"
dependencies = []

[project.scripts]
ctx = "wscontext.cli.main:main"

[dependency-groups]
dev = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wscontext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
