[project]
name = "wscontext"
version = "0.3.1"
description = "Local harness for Claude Code: session capture, commit links and search"
requires-python = ">=3.13"
dependencies = [
    "tree-sitter",
    "tree-sitter-python",
    "tree-sitter-javascript",
    "tree-sitter-typescript",
]

[project.scripts]
ctx = "wscontext.cli.main:main"

[dependency-groups]
dev = [
    "pytest",
    "pytest-xdist>=3.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/wscontext"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-n auto --dist load"
